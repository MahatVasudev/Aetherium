syntax = "proto3";

package aetherium_ml;

service AetheriumMLService {
  rpc EmbedBatch(EmbedBatchRequest) returns (EmbedBatchResponse);
  rpc EmbedQuery(EmbedQueryRequest) returns (EmbedQueryResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc Cluster(ClusterRequest) returns (ClusterResponse);
}

message EmbedBatchRequest { repeated TextChunk chunks = 1; }

message TextChunk {
  string chunk_id = 1;
  string doc_id = 2;
  int32 chunk_index = 3;
  string text = 4;
}

message EmbedBatchResponse { repeated ChunkEmbedding embeddings = 1; }

message ChunkEmbedding {
  string chunk_id = 1;
  string doc_id = 2;
  repeated float vector = 3;
}

message EmbedQueryRequest { string query = 1; }

message EmbedQueryResponse { repeated float vector = 1; }

message HealthRequest {}

message HealthResponse {
  string status = 1;
  string version = 2;
  string model = 3;
  uint32 dims = 4;
}

message ClusterRequest {
  repeated ChunkVector chunks = 1;
  string cluster_method = 2;
  string reducer_method = 3;

  oneof reducer_config {
    UMAPConfig umap_config = 4;
    LDAConfig lda_config = 5;
    LSAConfig lsa_config = 6;
    NoneReduceConfig none_config = 8;
  }

  oneof cluster_config {
    HDBSCANConfig hdbconfig = 9;
    KMeansConfig kmeansconfig = 10;
    DBSCANConfig dbscanconfig = 11;
  }
}

message HDBSCANConfig {
  uint32 min_cluster_size = 1;
  optional uint32 min_samples = 2;
  string metric = 3;
}

message KMeansConfig {}

message DBSCANConfig {}

message NoneReduceConfig {}

message UMAPConfig {
  uint32 n_components = 1;
  uint32 n_neighbors = 2;
  float min_distance = 3;
  string metric = 4;
}

message LDAConfig {
  uint32 n_components = 1;
  uint32 max_iter = 2;
  string learning_method = 3;
}

message LSAConfig { uint32 n_components = 1; }

message ChunkVector {
  string chunk_id = 1;
  string doc_id = 2;
  oneof vector {
    EmbeddingVector embedding = 3;
    TFIDFVector tfidf = 4;
  }
}

message EmbeddingVector { repeated float values = 1; }

message TFIDFVector { repeated float values = 1; }

message ClusterResponse {
  repeated ChunkCluster assignments = 1;
  int32 n_clusters = 2;
}

message ChunkCluster {
  string chunk_id = 1;
  int32 cluster_id = 2;
}
